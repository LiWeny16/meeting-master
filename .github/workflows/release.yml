name: Release Windows
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.0.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CARGO_BUILD_JOBS: '2'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run tauri:build
      - run: npm test
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          node scripts/release-manifest.mjs $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $dir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $dir -Filter '*_x64-setup.exe' | Where-Object { $_.Name -like "*_$($tag.Substring(1))_x64-setup.exe" } | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          gh release create $tag --verify-tag --draft --title "Meeting Master $tag" --generate-notes $installer.FullName "$($installer.FullName).sig" "$dir/latest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
