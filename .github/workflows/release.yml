name: Release Windows
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v1.0.1)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      CARGO_BUILD_JOBS: '2'
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run lint
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run tauri:build
      - run: npm test
      - name: Prepare release metadata
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          node scripts/release-manifest.mjs $tag
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $dir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem $dir -Filter '*_x64-setup.exe' | Where-Object { $_.Name -like "*_$($tag.Substring(1))_x64-setup.exe" } | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $assetDir = Join-Path $env:RUNNER_TEMP 'meeting-master-release-assets'
          New-Item -ItemType Directory -Force $assetDir | Out-Null
          $assetName = $installer.Name.Replace(' ', '.')
          $asset = Join-Path $assetDir $assetName
          Copy-Item -LiteralPath $installer.FullName -Destination $asset
          Copy-Item -LiteralPath "$($installer.FullName).sig" -Destination "$asset.sig"
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $existing | ConvertFrom-Json
            if (-not $release.isDraft) { throw "Refusing to replace assets on published release $tag" }
          } else {
            gh release create $tag --verify-tag --draft --title "Meeting Master $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag --clobber $asset "$asset.sig" "$dir/latest.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
