[package]
name = "meeting-master"
version = "1.0.0"
description = "Local-first Windows meeting assistant"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "meeting_master_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
hmac = "0.12"
hound = "3.5"
log = "0.4"
md-5 = "0.10"
reqwest = { version = "0.13", features = ["json", "query", "stream"] }
rubato = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
wasapi = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
] }
winreg = "0.56"
